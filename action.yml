name: true-site-size
description: >
  Measures the real network bytes a browser transfers, from cold cache until
  your app signals readiness with a performance.mark, and comments the change
  on pull requests. Captures eager over-loading that file-size diffing cannot
  see.
author: Claude (Anthropic AI agent), commissioned by Jim Higson
branding:
  icon: download-cloud
  color: blue

inputs:
  journey:
    description: >
      JSON array of steps measuring an interactive journey in one browser
      session: {goto: url}, {click: selector}, {waitFor: selector},
      {waitForGone: selector}, {keys: "Enter ArrowDown"}, {script: "..."},
      {row: name, mark: markName}. Each row step closes a
      measurement segment when its performance.mark fires and the network
      settles; {row: name, marks: [m1, m2]} waits for all the named marks,
      for apps whose readiness is several independently-loading parts. A row
      may carry emoji to badge it in the comment (eg {row: menu, mark:
      menu-ready, emoji: "🎮"}) instead of the auto-assigned colour circle.
      {startAgain: name} relaunches the browser cold (empty cache) so one
      journey can measure several apps served from the same build: rows after
      it accumulate as a new visit with its own cumulative Σ rows and total;
      as the journey's first step it just names the first visit. Any step may
      carry afterMark to await an app readiness mark first. Takes precedence
      over `scenarios`.
    default: ""
  ignore-url-patterns:
    description: >
      JSON array of regex strings. Matching requests are excluded from byte
      counts (still shown in the run-log breakdown, tagged ignored) - for
      endpoints whose response size legitimately varies, eg live db reads.
    default: "[]"
  step-timeout-ms:
    description: per-step timeout, eg waiting for a click target to appear
    default: "20000"
  settle-timeout-ms:
    description: >
      hard cap on waiting for the network to go quiet after a mark - if the
      app never stops requesting (eg endless polling), the row errors with the
      in-flight urls named rather than hanging
    default: "30000"
  timeout-ms:
    description: >
      hard cap on the entire action (builds and all measurement runs) - a
      last-resort guard so nothing can hang a ci job indefinitely
    default: "900000"
  scenarios:
    description: >
      simple form of `journey`: JSON array like
      [{"name": "menu", "url": "/", "mark": "menu-ready"}], each entry a
      navigation then a row. Scenarios run in order in one browser session
      with a shared http cache, so each reports only its incremental bytes.
      An entry may carry emoji to badge its row in the comment instead of the
      auto-assigned colour circle.
    default: "[]"
  install-command:
    description: command to install dependencies in each checkout (empty to skip)
    default: ""
  build-command:
    description: command that produces the serveable site
    default: "npm run build"
  clean-command:
    description: >
      command run in the workspace between the head and base builds (empty to
      skip). The base checks out into a worktree inside the workspace, so
      without this its build can inherit head's node_modules via upward module
      resolution; eg "pnpm clean" isolates them.
    default: ""
  serve-dir:
    description: directory (relative to the checkout) to serve after building
    default: "dist"
  compression:
    description: >
      simulate the production host's compression - gzip, br, zstd or none.
      zstd requires the runner's Node to be >= 22.15 (or >= 23.8); gzip, br
      and none work on any supported Node.
    default: "gzip"
  compression-level:
    description: >
      compression level for the chosen encoding, or "max" for the codec's
      maximum. Empty uses a moderate default per codec: gzip 8, br 4, zstd 6.
      Valid ranges: gzip 0-9, br 0-11, zstd 1-22. Ignored when compression is
      none.
    default: ""
  runs:
    description: >
      repeat count. Runs are expected to be byte-identical - the extra run is
      a determinism self-check, and disagreement is flagged on the comment.
    default: "2"
  settle-ms:
    description: ms of network quiet required after the mark before stopping
    default: "1500"
  mark-timeout-ms:
    description: ms to wait for each scenario's performance.mark
    default: "60000"
  base-refs:
    description: >
      JSON array of refs to compare against (defaults to the PR base branch).
      Each becomes its own column in the comment, linked to the exact commit
      and annotated with git describe. eg ["main", "v1.4.0"] compares the PR
      against both main and a release tag.
    default: "[]"
  comment:
    description: post/update a PR comment with the results
    default: "true"
  pr-number:
    description: >
      PR number to post the comment on. Defaults to the PR that triggered the
      run; set it to comment from a non-PR event - eg a push to main updating
      an open release PR's report so it reflects the just-merged code.
    default: ""
  collapse-breakdown:
    description: >
      collapse each ref's per-file breakdown into an expandable <details>
      (true) or show it inline (false). Rows with no changes are always a
      plain line, since there is nothing to reveal by expanding.
    default: "true"
  measure-disk:
    description: >
      also report the total built size on disk - the compressed (as served,
      matching `compression`) size of every file in serve-dir, loaded or not,
      with its own changed-files breakdown. Catches shipped-but-unloaded dead
      weight. Set false to skip compressing the whole site on large builds.
    default: "true"
  comment-key:
    description: >
      distinguishes multiple uses on one PR - each key maintains its own
      comment (and is shown in the comment heading)
    default: ""
  spread-tolerance-bytes:
    description: >
      byte spread between repeat runs treated as protocol noise rather than
      non-determinism (h2 header compression varies slightly with request
      arrival order). Spread above this triggers the determinism warning.
    default: "512"
  minimum-change-threshold:
    description: >
      changes smaller than this many bytes display as unchanged - same name,
      semantics and default as compressed-size-action
    default: "1"
  strip-hash:
    description: >
      regex removed from request filenames so the per-file breakdown matches
      files across base and head despite content hashes (default matches
      vite/rollup style "-D4zXn_7K." hashes). Empty string disables.
    default: "(-[a-zA-Z0-9_-]{8})\\."
  github-token:
    description: token used to post the PR comment
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # rolling store of base-ref measurements, keyed inside by (sha, config) -
    # repeat pushes to a pr skip rebuilding and re-measuring the base
    - uses: actions/cache@v4
      with:
        path: ~/.true-site-size-cache
        key: true-site-size-base-${{ github.run_id }}
        restore-keys: |
          true-site-size-base-
    - run: node "${{ github.action_path }}/dist/main.mjs"
      shell: bash
      env:
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_JOURNEY: ${{ inputs.journey }}
        INPUT_IGNORE_URL_PATTERNS: ${{ inputs.ignore-url-patterns }}
        INPUT_STEP_TIMEOUT_MS: ${{ inputs.step-timeout-ms }}
        INPUT_SETTLE_TIMEOUT_MS: ${{ inputs.settle-timeout-ms }}
        INPUT_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
        INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        INPUT_CLEAN_COMMAND: ${{ inputs.clean-command }}
        INPUT_SERVE_DIR: ${{ inputs.serve-dir }}
        INPUT_COMPRESSION: ${{ inputs.compression }}
        INPUT_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        INPUT_RUNS: ${{ inputs.runs }}
        INPUT_SETTLE_MS: ${{ inputs.settle-ms }}
        INPUT_MARK_TIMEOUT_MS: ${{ inputs.mark-timeout-ms }}
        INPUT_BASE_REFS: ${{ inputs.base-refs }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_COLLAPSE_BREAKDOWN: ${{ inputs.collapse-breakdown }}
        INPUT_MEASURE_DISK: ${{ inputs.measure-disk }}
        INPUT_COMMENT_KEY: ${{ inputs.comment-key }}
        INPUT_STRIP_HASH: ${{ inputs.strip-hash }}
        INPUT_SPREAD_TOLERANCE_BYTES: ${{ inputs.spread-tolerance-bytes }}
        INPUT_MINIMUM_CHANGE_THRESHOLD: ${{ inputs.minimum-change-threshold }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
