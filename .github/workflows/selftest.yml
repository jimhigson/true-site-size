name: selftest
on:
  push:
  pull_request:

jobs:
  fixture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # cover every supported encoding; zstd needs Node >= 22.15
        compression: [gzip, br, zstd, none]
    steps:
      - uses: actions/checkout@v4
      # pin a Node new enough for zstd (zlib.zstdCompressSync landed in 22.15)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./
        with:
          build-command: ""
          serve-dir: fixtures/site
          comment: "false"
          runs: "2"
          compression: ${{ matrix.compression }}
          # exercise the multi-ref base path (fetch + worktree + per-ref column)
          base-refs: '["main"]'
          ignore-url-patterns: '["varies\\.json$"]'
          # the startAgain visit reloads the same page cold - its row should
          # re-transfer the full page bytes rather than hit the http cache
          journey: |
            [
              { "startAgain": "first visit" },
              { "goto": "/" },
              { "row": "load", "mark": "fixture-ready" },
              { "click": "#more" },
              { "row": "after click", "mark": "more-ready" },
              { "startAgain": "cold reload" },
              { "goto": "/" },
              { "row": "load again", "mark": "fixture-ready" }
            ]
