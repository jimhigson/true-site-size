name: selftest
on:
  push:
  pull_request:

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          build-command: ""
          serve-dir: fixtures/site
          comment: "false"
          runs: "2"
          ignore-url-patterns: '["varies\\.json$"]'
          journey: |
            [
              { "goto": "/" },
              { "row": "load", "mark": "fixture-ready" },
              { "click": "#more" },
              { "row": "after click", "mark": "more-ready" }
            ]
